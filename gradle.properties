# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true

# Environment Properties
# You can find the latest 1.20.1 Forge builds at:
# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html
minecraft_version=1.20.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.20.1,1.21)
# The Forge version must agree with the Minecraft version to get a valid artifact.
forge_version=47.2.0
# The Forge version range only needs the major version of Forge as bounds.
forge_version_range=[47,)
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[47,)

## Mod Properties
mod_id=lightengine
mod_name=Light Engine
mod_license=MIT
# Keep the full version (mod + mc) like the Fabric 1.20.1 branch does.
mod_version=1.0.0-alpha3+1.20.1
mod_group_id=me.tewek.lightengine

# MixinExtras (forge variant) for @ModifyExpressionValue.
mixinextras_version=0.3.6
