# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.2

# MC 26.x ships unobfuscated (official names, no client_mappings from
# Mojang): tell Loom to skip mappings/intermediary/remap entirely.
fabric.loom.disableObfuscation=true

# Mod Properties
version=1.0.0-alpha3
group=me.tewek.lightengine

# Dependencies
fabric_api_version=0.161.0+26.3
modmenu_version=22.0.0-alpha.1
